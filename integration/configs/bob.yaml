# Bob's per-agent server config — JOINER in the M3 demo.
#
# Boot: `python -m integration.mcp_server integration/configs/bob.yaml`.
#
# Bob locks stake under Alice's room admission purpose, presents the
# dev-vc issued offline by setup_demo.py, gets admitted, exchanges a
# message, transfers some sats.

agent:
  name: bob
  seed_path: ~/.openclaw-bob/seed.txt
  network: TESTNET

ipv8:
  bind_ip: 127.0.0.1
  bind_port: 9092

mcp:
  bind_ip: 127.0.0.1
  bind_port: 8082

peers_file: integration/configs/peers.yaml

vc_store:
  - vc_id: dev-vc
    file: ~/.openclaw-bob/credentials/dev-vc.json

faucet:
  amount: 5000   # bob locks 1000 of these for admission

logging:
  no_stdout: false
