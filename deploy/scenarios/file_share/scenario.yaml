# Scenario: file_share
#
# Minimal three-agent scenario that demos *only* peer-to-peer file
# sharing — no donations, no treasury, no signed-log replication, no
# seedbox-growth step.
#
#   seeder      hosts the Creative Commons content library and answers
#               SEARCH requests on the content_community overlay. Never
#               stops. Wallet balance zero (no btc activity).
#   fetcher_1   knows seeder; mission: search and fetch one file.
#               Stops on torrent_progress_gte_1.
#   fetcher_2   same as fetcher_1.
#
# `file_share_mode: true` flips deploy/state_snapshot.py::_next_objective
# into bypass mode — non-gatekeeper agents see retrieve_content
# immediately, no donation prompt. The admission machinery is still
# present in the codebase but inert for this scenario.
#
# `signed_log_port: 0` on every agent disables the signed-log pull loop —
# no inter-agent log replication. The /head HTTP chatter that dominates
# the payment demo's journals will not appear here.
#
# Port windows (disjoint from payment / file_transfer / etc.):
#   IPv8 UDP    8210-8212
#   MCP TCP     18790-18792
#   SignedLog TCP unused (signed_log_port=0 on every agent)

name: file_share
description: >-
  Three-agent peer-to-peer file sharing demo. One seeder serves a
  Creative Commons library; two fetchers each search the network and
  download a single file. No donations, no replication, no seedbox
  growth — only steps 4-5 of the seven-step storyline.

file_share_mode: true

# Honestly exercise the markdown-as-overlay wire distribution path: only
# the seeder gets PUBLISH_OVERLAY pointing at content_community.md at
# boot; fetchers must request the descriptor from the seeder over the
# bootstrap community (OVERLAY_REQUEST -> OVERLAY_DELIVERY) before they
# can run the content overlay's SEARCH messages. scenario_boot also
# cross-registers each agent's watchdog IPv8 port so OVERLAY_DELIVERY
# replies can route back. See agent.runtime.ensure_default_overlays_loaded.
wire_distribute_overlays: true

# Two-author overlay-evolution chain: fetcher_1 (genesis) authors
# download_announce v1.0.0; fetcher_2 (successor) adopts it + designs
# v1.1.0. Drives EVOLUTION_BASE_OVERLAY_NAME + OVERLAY_AUTHOR_MODE at boot
# and the author/adopt/announce ladder in state_snapshot._next_objective.
evolution_base_overlay: download_announce

watchdog:
  # interval_s doubles as the per-turn subprocess budget +30. 240s
  # gives each agent ~75s of LLM headroom while keeping ticks tight
  # for a short live demo. Joiners only need ~1-2 successful turns
  # (search -> download) so total wall-clock should stay under 10 min.
  interval_s: 240
  max_iterations_per_turn: 1
  # 3 agents × turns: fetcher_1 now runs 2 productive turns (fetch +
  # author), the seeder needs a turn to adopt the authored overlay, plus
  # slack for retries. Bumped 16 -> 24 for the protocol-evolution phase.
  max_total_turns: 24
  # Hard cap so the scenario auto-terminates if something hangs. The v4
  # evolution chain is a long SEQUENCE across agents — fetch -> author
  # v1.0.0 -> fetcher_2 adopt -> fetcher_1 ANNOUNCE -> fetcher_2 design
  # v1.1.0 — each gated on a separate ~240s tick, and each authoring step
  # is a real LLM compile that can take ~60s on a loaded backend. 20 min
  # was too tight (a prior run hit the cap seconds after v1.0.0 landed,
  # before the chain could continue). 60 min gives the full chain room;
  # a healthy run still finishes well under it.
  max_wall_clock_s: 3600

observability:
  log_dir: /var/log/delftclaw/scenarios/file_share

agents:

  seeder:
    ipv8_port: 8210
    mcp_port: 18790
    signed_log_port: 0
    publish_overlays:
      - protocol/examples/content_community.md
    mission_file: seeder/mission.md
    stop_predicate: never
    library_csv: protocol/examples/cc_library/content_catalog.csv
    # Wallet balance irrelevant — no donations in this scenario. Kept
    # at zero so any accidental wallet_send tool call fails closed.
    initial_balance_sats: 0

  fetcher_1:
    ipv8_port: 8211
    mcp_port: 18791
    signed_log_port: 0
    publish_overlays: []
    mission_file: fetcher_1/mission.md
    overlay_author_role: genesis
    # v4 genesis author: fetch the file, author download_announce v1.0.0,
    # AND send one ANNOUNCE so fetcher_2 can observe the protocol in use.
    stop_predicate: download_done_and_overlay_authored_and_announce_sent
    # Meshed with fetcher_2 (not just the seeder): fetcher_1's OverlayOffer
    # for v1.0.0 must reach fetcher_2, and its Phase-3 ANNOUNCE is a unicast
    # to fetcher_2. A star topology (seeder-only) would strand both.
    peers:
      - seeder
      - fetcher_2
    initial_balance_sats: 0

  fetcher_2:
    ipv8_port: 8212
    mcp_port: 18792
    signed_log_port: 0
    publish_overlays: []
    mission_file: fetcher_2/mission.md
    overlay_author_role: successor
    # v4 successor author: fetch its file, adopt fetcher_1's v1.0.0, observe
    # an ANNOUNCE, then DESIGN v1.1.0. Stops once it has authored a successor.
    stop_predicate: download_done_and_overlay_authored
    peers:
      - seeder
      - fetcher_1
    initial_balance_sats: 0
