# Scenario: regtest_transfer
#
# Two agents running on one host, performing a REAL Bitcoin transaction
# on a local bitcoind regtest node via JSON-RPC.
#
# Flow (high level):
#   1) bob joins the community via an RPC-backed on-chain donation.
#   2) alice mines blocks via regtest RPC (receives spendable coinbase).
#   3) alice sends a portion of those sats to bob's advertised on-chain address.
#   4) alice mines one block to confirm the transfer.

name: regtest_transfer
description: >-
  Two-agent regtest transaction demo: alice mines spendable regtest BTC via RPC
  and sends 20,000 satoshis to bob, then mines a block to confirm.

watchdog:
  interval_s: 240
  max_iterations_per_turn: 1
  max_total_turns: 60
  max_wall_clock_s: 7200

observability:
  log_dir: /var/log/delftclaw/scenarios/regtest_transfer

agents:

  alice:
    ipv8_port: 8200
    mcp_port: 18865
    publish_overlays:
      - protocol/examples/content_community.md
    mission_file: alice/mission.md
    stop_predicate: bitcoin_sent_sats(min_sats=20000)
    peers:
      - bob
    initial_balance_sats: 200000
    btc_network: regtest
    # Optional override; defaults to http://127.0.0.1:18443
    bitcoin_rpc_url: http://127.0.0.1:18443

  bob:
    ipv8_port: 8201
    mcp_port: 18866
    publish_overlays: []
    mission_file: bob/mission.md
    stop_predicate: wallet_received_sats(min_sats=20000)
    peers:
      - alice
    initial_balance_sats: 10000
    btc_network: regtest
    bitcoin_rpc_url: http://127.0.0.1:18443


