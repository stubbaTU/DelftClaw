# Scenario: secure_community_demo
#
# Combined run: the full four-agent community demo story plus an embedded
# malicious episode from the previously-good file seeker.

name: secure_community_demo
description: >-
  Four real OpenClaw agents run the community demo story. After agent_2
  joins, searches, and retrieves the Creative Commons file, the same agent
  demonstrates the defense-in-depth security episode: prevention, reputation
  drop and expulsion, then containment.

watchdog:
  interval_s: 30
  max_iterations_per_turn: 12
  max_total_turns: 36
  max_wall_clock_s: 10800

observability:
  log_dir: /var/log/delftclaw/scenarios/secure_community_demo

agents:

  agent_1:
    ipv8_port: 8394
    mcp_port: 18970
    redteam_port: 28970
    publish_overlays:
      - protocol/examples/content_community.md
    mission_file: founder_seedbox/founder_seedbox_mission.md
    stop_predicate: community_seedbox_count_gte_N(n=2)
    seed_content:
      - magnet: "magnet:?xt=urn:btih:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa&dn=creative_commons_audio.txt"
        name: "Creative Commons Audio"
        size: 37
        mime: text/plain
        tags: [Creative Commons, audio, demo]
    initial_balance_sats: 200000

  agent_2:
    ipv8_port: 8395
    mcp_port: 18971
    redteam_port: 28971
    publish_overlays: []
    mission_file: compromised_file_seeker/compromised_file_seeker_mission.md
    stop_predicate: integrated_security_done
    peers:
      - agent_1
    initial_balance_sats: 100000

  agent_3:
    ipv8_port: 8396
    mcp_port: 18972
    redteam_port: 28972
    publish_overlays: []
    mission_file: third_member/third_member_mission.md
    stop_predicate: community_member_count_gte_N(n=3)
    peers:
      - agent_1
    initial_balance_sats: 100000

  agent_4:
    ipv8_port: 8397
    mcp_port: 18973
    redteam_port: 28973
    publish_overlays: []
    mission_file: seedbox_scaler/seedbox_scaler_mission.md
    stop_predicate: community_seedbox_count_gte_N(n=2)
    peers:
      - agent_1
    initial_balance_sats: 100000
